<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - TravelBloom</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="logo">TravelBloom</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About Us</a></li>
      <li><a href="contact.html">Contact Us</a></li>
    </ul>
  </nav>

  <section class="page-section">
    <h1>CONTACT US</h1>
    <p>Have questions or need personalized travel advice? Reach us at <strong>support@travelbloom.com</strong> or fill out the form below.</p>

    <form class="contact-form" onsubmit="event.preventDefault(); alert('Thank you! Your message has been sent.');">
      <label for="name">Name</label>
      <input type="text" id="name" placeholder="Enter your name" required>

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Enter your email" required>

      <label for="message">Message</label>
      <textarea id="message" rows="5" placeholder="Write your message here" required></textarea>

      <button type="submit">Submit</button>
    </form>
  </section>
</body>
</html>
